name: Aman Security Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aman-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-threat-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify single workflow file
        run: python3 tools/verify_single_workflow.py

      - name: Configure threat database signing key
        id: threat_key
        env:
          THREAT_KEY_B64: ${{ secrets.THREAT_DB_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          if [ -n "$THREAT_KEY_B64" ]; then
            printf '%s' "$THREAT_KEY_B64" | base64 --decode > "$RUNNER_TEMP/aman-threat-signing.pem"
            chmod 600 "$RUNNER_TEMP/aman-threat-signing.pem"
            echo "THREAT_PRIVATE_KEY=$RUNNER_TEMP/aman-threat-signing.pem" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Threat refresh is skipped until THREAT_DB_PRIVATE_KEY_BASE64 is configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh indicator-only threat intelligence
        if: steps.threat_key.outputs.available == 'true'
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          PHISHING_FEED_URL: ${{ secrets.PHISHING_FEED_URL }}
        run: python3 tools/refresh_threat_intel.py --private-key "$THREAT_PRIVATE_KEY" --limit 5000

      - name: Create source status when refresh is disabled
        if: steps.threat_key.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p threat-intel
          python3 - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          now=dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          Path('threat-intel/source_status.json').write_text(json.dumps({
            'schema':1,'generatedAt':now,'refreshEnabled':False,'dataChanged':False,'signed':False,
            'malwareBinariesDownloaded':0,'sources':{}
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Verify threat-intelligence quality
        run: |
          python3 tools/sync_reviewed_relationships.py
          python3 tools/reviewed_reputation_gate.py
          python3 tools/threat_intel_quality_gate.py
          python3 tools/threat_db_continuity_gate.py
          python3 tools/threat_source_health_gate.py threat-intel/source_status.json --max-age-hours 24

      - name: Verify signed threat data
        run: |
          python3 tools/verify_threat_db.py
          python3 tools/verify_reputation_shards.py

      - name: Commit refreshed indicators when changed
        if: steps.threat_key.outputs.available == 'true'
        shell: bash
        run: |
          if git diff --quiet -- threat-db reputation app/src/main/assets/threat-db app/src/main/assets/reputation; then
            echo "No threat-intelligence changes to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "aman-security-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add threat-db reputation app/src/main/assets/threat-db app/src/main/assets/reputation
            git commit -m "chore(threat-intel): refresh signed Android indicators [skip ci]"
            git push origin HEAD:main
            echo "Signed Android threat intelligence was refreshed and committed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package refreshed threat data for build job
        run: tar -czf "$RUNNER_TEMP/aman-threat-refresh.tgz" threat-db reputation app/src/main/assets/threat-db app/src/main/assets/reputation threat-intel/source_status.json

      - name: Upload threat refresh state
        uses: actions/upload-artifact@v4
        with:
          name: aman-threat-refresh
          path: ${{ runner.temp }}/aman-threat-refresh.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload source-health report
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.3.0-Threat-Source-Health
          path: threat-intel/source_status.json
          if-no-files-found: error
          retention-days: 30

  build-and-verify:
    needs: refresh-threat-intelligence
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download refreshed threat data
        uses: actions/download-artifact@v4
        with:
          name: aman-threat-refresh
          path: ${{ runner.temp }}/aman-threat-refresh

      - name: Overlay refreshed threat data
        run: tar -xzf "$RUNNER_TEMP/aman-threat-refresh/aman-threat-refresh.tgz" -C "$GITHUB_WORKSPACE"

      - name: Verify single workflow file
        run: python3 tools/verify_single_workflow.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Configure optional release upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aman-upload.jks"
            chmod 600 "$RUNNER_TEMP/aman-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aman-upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Check Arabic and English localization
        run: python3 tools/verify_localization.py

      - name: Verify signed threat database and reputation shards
        run: |
          python3 tools/verify_threat_db.py
          python3 tools/verify_reputation_shards.py

      - name: Verify threat-intelligence quality and source health
        run: |
          python3 tools/sync_reviewed_relationships.py
          python3 tools/reviewed_reputation_gate.py
          python3 tools/threat_intel_quality_gate.py
          python3 tools/threat_db_continuity_gate.py
          python3 tools/threat_source_health_gate.py threat-intel/source_status.json --max-age-hours 24

      - name: Verify Real Antivirus Core architecture
        run: python3 tools/real_antivirus_gate.py

      - name: Run detection-engine architecture gate
        run: python3 tools/detection_gate.py

      - name: Verify continuous protection hardening
        run: python3 tools/continuous_protection_gate.py

      - name: Verify threat intelligence and reputation expansion
        run: python3 tools/threat_reputation_2_3_gate.py

      - name: Run source quality gate
        run: python3 tools/quality_gate.py

      - name: Run release-readiness gate
        run: python3 tools/release_gate.py

      - name: Run strict safe regression benchmark
        run: |
          python3 tools/benchmark_detection.py benchmarks/regression_detection.csv \
            --threshold 55 --min-detection-rate 1.0 --max-false-positive-rate 0.0 \
            --min-precision 1.0 --min-family-accuracy 1.0 \
            --json-out build/reports/aman-regression-quality.json

      - name: Run false-positive boundary stress benchmark
        run: |
          python3 tools/benchmark_detection.py benchmarks/false_positive_stress.csv \
            --threshold 55 --min-detection-rate 0.0 --max-false-positive-rate 0.0 \
            --min-precision 0.0 \
            --json-out build/reports/aman-false-positive-stress-quality.json

      - name: Run reviewed real-world verdict gate when corpus is configured
        shell: bash
        run: |
          ROWS=$(tail -n +2 benchmarks/reviewed_detection_results.csv | grep -cv '^$' || true)
          if [ "$ROWS" -gt 0 ]; then
            python3 tools/benchmark_detection.py benchmarks/reviewed_detection_results.csv \
              --threshold 55 --min-detection-rate 0.95 --max-false-positive-rate 0.01 \
              --min-precision 0.95 --min-family-accuracy 0.80 \
              --json-out build/reports/aman-reviewed-quality.json
            echo "Reviewed detection corpus quality gate ran on $ROWS exported verdicts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Reviewed real-world verdict corpus is not configured; no public detection-rate claim is produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build debug APK and release App Bundle
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Verify signed release bundle when upload key is configured
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Write build summary
        shell: bash
        run: |
          echo "### Aman Security 2.3.0 – Threat Intelligence & Reputation Expansion" >> "$GITHUB_STEP_SUMMARY"
          echo "Android-focused threat intelligence, reviewed signer/graph infrastructure, signed exact reputation shards and Bloom prefilter, stronger impersonation detection, compound DEX rules, continuity checks, unit tests and lint passed." >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_SIGNING_CONFIGURED" = "true" ]; then
            echo "Release AAB was signed with the configured upload key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release AAB is unsigned because upload-key secrets were not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detection-quality reports
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.3.0-Detection-Quality
          path: build/reports/aman-*-quality.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.3.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.3.0-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.3.0-R8-Mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
