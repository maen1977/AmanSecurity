name: Build Aman Security Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Arabic and English localization
        run: python3 tools/verify_localization.py

      - name: Run Aman Security quality gate
        run: python3 tools/quality_gate.py

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Aman Security APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-Phase1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
