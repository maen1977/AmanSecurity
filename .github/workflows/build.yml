name: Build Aman Security

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aman-security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Remove legacy pre-2.6 update material
        shell: bash
        run: |
          python3 tools/repository_cleanup_2_6.py --apply
          echo "Legacy threat-update material removed from build workspace."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Aman production quality gates
        shell: bash
        run: |
          python3 tools/sync_reviewed_relationships.py
          python3 tools/quality_gate.py

      - name: Evaluate reviewed corpus metadata when present
        shell: bash
        run: |
          mkdir -p app/build/reports
          if [ "$(wc -l < benchmarks/reviewed_detection_results.csv)" -gt 1 ]; then
            python3 tools/benchmark_detection.py benchmarks/reviewed_detection_results.csv \
              --require-reviewed \
              --json-out app/build/reports/production-validation.json
          else
            echo "Reviewed production corpus metadata is empty; no real-world detection claim is generated."
          fi

      - name: Capture release dependency inventory
        shell: bash
        run: |
          mkdir -p app/build/reports
          gradle :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-dependencies.txt

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release App Bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Generate build artifact checksums
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab > build-artifact-sha256.txt
          cat build-artifact-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.7.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.7.0-Unsigned-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.7.0-Verification-Reports
          path: |
            app/build/reports/
            app/build/test-results/
            build-artifact-sha256.txt
          if-no-files-found: ignore
          retention-days: 14
