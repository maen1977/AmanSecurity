name: Build Aman Security

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aman-security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Remove legacy pre-2.6 update material
        shell: bash
        run: |
          python3 tools/repository_cleanup_2_6.py --apply
          echo "Legacy threat-update material removed from build workspace."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Aman 2.6 quality gates
        shell: bash
        run: |
          python3 tools/sync_reviewed_relationships.py
          python3 tools/quality_gate.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release App Bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.6.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmanSecurity-2.6.0-Unsigned-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
