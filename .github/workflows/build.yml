name: Aman Security Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    # Publish once daily at 03:17 UTC; device checks are independently staggered.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aman-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  threat-intelligence:
    name: Build Aman intelligence package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build compact cloud threat database
        id: intel
        shell: bash
        env:
          AMAN_THREAT_DB_PRIVATE_KEY_B64: ${{ secrets.AMAN_THREAT_DB_PRIVATE_KEY_B64 }}
          AMAN_THREAT_PUBLISH_TOKEN: ${{ secrets.AMAN_THREAT_PUBLISH_TOKEN }}
          AMAN_THREAT_DEPLOY_KEY: ${{ secrets.AMAN_THREAT_DEPLOY_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AMAN_THREAT_DB_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::AMAN_THREAT_DB_PRIVATE_KEY_B64 is not configured. Add the signing secret before running the intelligence factory."
            exit 1
          fi
          if [ -z "${AMAN_THREAT_PUBLISH_TOKEN:-}" ] && [ -z "${AMAN_THREAT_DEPLOY_KEY:-}" ]; then
            echo "::error::Configure AMAN_THREAT_PUBLISH_TOKEN or AMAN_THREAT_DEPLOY_KEY with write access to AmanSecurity-Threat-DB."
            exit 1
          fi
          python3 tools/build_cloud_threat_db.py --output dist/cloud-threat-db --min-app-version-code 56
          python3 tools/prepare_cloud_bundle.py \
            --dir dist/cloud-threat-db \
            --bundle-name "aman-threat-db-${GITHUB_RUN_ID}.zip"
          python3 tools/sign_cloud_threat_db.py \
            --manifest dist/cloud-threat-db/manifest.json \
            --signature dist/cloud-threat-db/manifest.sig
          python3 tools/verify_cloud_threat_db.py --dir dist/cloud-threat-db
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish immutable-format latest package to public threat repository
        id: publish
        if: steps.intel.outcome == 'success'
        shell: bash
        env:
          AMAN_THREAT_PUBLISH_TOKEN: ${{ secrets.AMAN_THREAT_PUBLISH_TOKEN }}
          AMAN_THREAT_DEPLOY_KEY: ${{ secrets.AMAN_THREAT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AMAN_THREAT_PUBLISH_TOKEN:-}" ] && [ -z "${AMAN_THREAT_DEPLOY_KEY:-}" ]; then
            echo "No write-capable mirror credential configured" >&2
            exit 1
          fi
          mkdir -p /tmp/aman-cloud-intel/latest
          cp dist/cloud-threat-db/manifest.json /tmp/aman-cloud-intel/latest/
          cp dist/cloud-threat-db/manifest.sig /tmp/aman-cloud-intel/latest/
          cp "dist/cloud-threat-db/aman-threat-db-${GITHUB_RUN_ID}.zip" /tmp/aman-cloud-intel/latest/
          cp dist/cloud-threat-db/build-report.json /tmp/aman-cloud-intel/latest/
          cp tools/verify_public_threat_mirror.py /tmp/aman-cloud-intel/verify_public_threat_mirror.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan aman-threat-db-publish
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p latest
          cp /tmp/aman-cloud-intel/latest/* latest/
          touch .nojekyll
          git add .nojekyll latest
          git commit -m "Aman threat intelligence $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # actions/checkout stores its GITHUB_TOKEN in local Git config; remove it so the
          # repository-scoped mirror token below is the only Authorization header sent.
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          push_succeeded=0
          if [ -n "${AMAN_THREAT_PUBLISH_TOKEN:-}" ]; then
            # Use an explicit Authorization header so Git cannot silently fall back to GITHUB_TOKEN.
            # The token value is never placed in the remote URL or printed to the log.
            auth_header="$(printf 'x-access-token:%s' "$AMAN_THREAT_PUBLISH_TOKEN" | base64 -w0)"
            token_login="$(curl -fsS -H "Authorization: Bearer $AMAN_THREAT_PUBLISH_TOKEN" https://api.github.com/user | python3 -c 'import json,sys; print(json.load(sys.stdin).get("login", "unknown"))')"
            token_repo_access="$(curl -fsS -H "Authorization: Bearer $AMAN_THREAT_PUBLISH_TOKEN" https://api.github.com/repos/maen1977/AmanSecurity-Threat-DB | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("permissions", {}); print("push=" + str(bool(p.get("push"))) + ",admin=" + str(bool(p.get("admin"))))')"
            echo "Mirror publish token identity: ${token_login}; repository access: ${token_repo_access}"
            git remote add threat-public "https://github.com/maen1977/AmanSecurity-Threat-DB.git"
            if git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push --force threat-public HEAD:main; then
              push_succeeded=1
            else
              echo "Repository-scoped token push failed; attempting configured SSH deploy-key fallback." >&2
              git remote remove threat-public
            fi
          fi
          if [ "$push_succeeded" -ne 1 ] && [ -n "${AMAN_THREAT_DEPLOY_KEY:-}" ]; then
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$AMAN_THREAT_DEPLOY_KEY" > "$HOME/.ssh/id_ed25619"
            chmod 600 "$HOME/.ssh/id_ed25619"
            ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            git remote add threat-public "git@github.com:maen1977/AmanSecurity-Threat-DB.git"
            if git push --force threat-public HEAD:main; then
              push_succeeded=1
            fi
          fi
          git remote remove threat-public 2>/dev/null || true
          if [ "$push_succeeded" -ne 1 ]; then
            echo "No configured credential could write to maen1977/AmanSecurity-Threat-DB." >&2
            exit 1
          fi

      - name: Report threat mirror publish warning
        if: steps.publish.outcome == 'failure'
        shell: bash
        run: echo "::error::Threat mirror publish failed; the release is blocked so devices cannot silently remain on an old intelligence package."

      - name: Smoke-test public threat mirror
        if: steps.intel.outcome == 'success' && steps.publish.outcome == 'success'
        shell: bash
        env:
          AMAN_THREAT_DB_BASE_URL: https://raw.githubusercontent.com/maen1977/AmanSecurity-Threat-DB/main/latest
        run: |
          set -euo pipefail
          python3 /tmp/aman-cloud-intel/verify_public_threat_mirror.py "$AMAN_THREAT_DB_BASE_URL"

      - name: Upload threat-package diagnostics
        if: always() && steps.intel.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MaenShield-9.0.14-Cloud-Threat-Package
          path: dist/cloud-threat-db/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Android app
    # Build the Android release whenever this is a push/manual run, even if the
    # optional intelligence publisher fails. This preserves the app build path.
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: threat-intelligence
    runs-on: ubuntu-latest
    env:
      AMAN_THREAT_DB_BASE_URL: https://raw.githubusercontent.com/maen1977/AmanSecurity-Threat-DB/main/latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Remove legacy pre-3.5 update material
        shell: bash
        run: |
          python3 tools/repository_cleanup_2_6.py --apply
          echo "Legacy phone-side threat-feed material removed from build workspace."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable CI debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aman-security-ci-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Aman production quality gates
        shell: bash
        run: |
          python3 tools/sync_reviewed_relationships.py
          python3 tools/quality_gate.py

      - name: Evaluate reviewed corpus metadata when present
        shell: bash
        run: |
          mkdir -p app/build/reports
          if [ "$(wc -l < benchmarks/reviewed_detection_results.csv)" -gt 1 ]; then
            python3 tools/benchmark_detection.py benchmarks/reviewed_detection_results.csv \
              --require-reviewed \
              --json-out app/build/reports/production-validation.json
          else
            echo "Reviewed production corpus metadata is empty; no real-world detection claim is generated."
          fi

      - name: Capture release dependency inventory
        shell: bash
        run: |
          mkdir -p app/build/reports
          gradle :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-dependencies.txt

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build installable release test APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Ensure CI test signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias AndroidDebugKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Sign release test APK with CI test key
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk MaenShield-9.0.14-TestRelease-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias AndroidDebugKey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MaenShield-9.0.14-TestRelease.apk \
            MaenShield-9.0.14-TestRelease-unsigned.apk
          test -s MaenShield-9.0.14-TestRelease.apk

      - name: Build unsigned release App Bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Generate build artifact checksums
        shell: bash
        run: |
          sha256sum MaenShield-9.0.14-TestRelease.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > build-artifact-sha256.txt
          cat build-artifact-sha256.txt

      - name: Publish latest Android build to GitHub Release
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v9.0.14"
          release_report="MaenShield-9.0.14-Verification-Reports.txt"
          {
            echo "Maen Shield v9.0.14"
            echo
            echo "Built by Aman Security Pipeline from commit ${GITHUB_SHA}."
            echo
            cat build-artifact-sha256.txt
          } > "$release_report"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              MaenShield-9.0.14-TestRelease.apk \
              app/build/outputs/bundle/release/*.aab \
              build-artifact-sha256.txt \
              "$release_report" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" \
              MaenShield-9.0.14-TestRelease.apk \
              app/build/outputs/bundle/release/*.aab \
              build-artifact-sha256.txt \
              "$release_report" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Maen Shield v9.0.14" \
              --notes "تم بناء الإصدار بواسطة Aman Security Pipeline من نفس commit التطبيق."
          fi

      - name: Upload direct-install APK
        uses: actions/upload-artifact@v4
        with:
          name: MaenShield-9.0.14-TestRelease-APK
          path: MaenShield-9.0.14-TestRelease.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaenShield-9.0.14-Unsigned-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaenShield-9.0.14-Verification-Reports
          path: |
            app/build/reports/
            app/build/test-results/
            build-artifact-sha256.txt
          if-no-files-found: ignore
          retention-days: 14
